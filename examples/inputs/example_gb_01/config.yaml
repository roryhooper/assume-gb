# GB-style sequential markets: DA (D 09:00 gate) -> ID (D 22:00 gate)
# -> hourly BAL (H-60min gate) -> imbalance settlement, delivery on D+1.
# Generated by examples/gb/generate_example_gb_01.py

base:
  start_date: 2019-01-07 00:00
  end_date: 2019-01-15 00:00
  time_step: 1h
  save_frequency_hours: 24

  unit_types:
    power_plant: sequential_power_plant
    storage: sequential_storage
    demand: sequential_demand

  bidding_strategy_params:
    bal_markup: 0
    sellback_price: 0
    storage_foresight: 12h

  markets_config:
    DA:
      operator: DA_operator
      product_type: energy
      start_date: 2019-01-07 08:30
      products:
        - duration: 1h
          count: 24
          first_delivery: 15h30m
      opening_frequency: 24h
      opening_duration: 30m
      volume_unit: MWh
      maximum_bid_volume: 100000
      maximum_bid_price: 3000
      minimum_bid_price: -500
      price_unit: GBP/MWh
      market_mechanism: pay_as_clear
      param_dict:
        forecast_vintage: da

    ID:
      operator: ID_operator
      product_type: energy
      start_date: 2019-01-07 21:30
      products:
        - duration: 1h
          count: 24
          first_delivery: 2h30m
      opening_frequency: 24h
      opening_duration: 30m
      volume_unit: MWh
      maximum_bid_volume: 100000
      maximum_bid_price: 3000
      minimum_bid_price: -500
      price_unit: GBP/MWh
      market_mechanism: pay_as_clear
      param_dict:
        forecast_vintage: id

    BAL:
      operator: BAL_operator
      product_type: balancing_energy
      start_date: 2019-01-07 22:50
      products:
        - duration: 1h
          count: 1
          first_delivery: 1h10m
      opening_frequency: 1h
      opening_duration: 10m
      volume_unit: MWh
      maximum_bid_volume: 100000
      maximum_bid_price: 3000
      minimum_bid_price: -500
      price_unit: GBP/MWh
      market_mechanism: balancing_pay_as_clear
      additional_fields:
        - fpn
        - position
      param_dict:
        imbalance_settlement: true
        forecast_vintage: actual
